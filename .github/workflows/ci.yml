name: CI/CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Docker image
        run: docker build -t webhook-pipeline .

      - name: Start docker compose
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for i in {1..10}; do
            curl -f http://localhost:3000/health && break
            echo "Waiting for API..."
            sleep 3
          done

      - name: Stop services
        run: docker compose down -v
  
  style:
    name: Style
    runs-on: ubuntu-latest

    steps:

      
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run formate
        run: npm run format:check

      - name: Run lint
        run: npm run lint